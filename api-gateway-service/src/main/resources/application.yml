server:
  port: 8888

spring:
  application:
    name: api-gateway-service
  kafka:
    consumer:
      group-id: api-gateway-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: itmo.programming.*
            use:
              type:
                headers: false
    bootstrap-servers: ${KAFKA_URL}
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: points-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/point/**
          - id: auth-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/auth/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

jwt:
  secret: ${JWT_SECRET}
