server:
  port: 8888

spring:
  application:
    name: api-gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: points-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/point/**
          - id: auth-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/auth/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG