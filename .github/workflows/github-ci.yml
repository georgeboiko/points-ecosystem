env:
  IMAGE_TAG: ${{ github.sha }}
  BASE_IMAGE: ${{ secrets.DOCKER_USERNAME }}/common-base:${{ github.sha }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  ACCESS_EXPIRATION_TIME: ${{ secrets.ACCESS_EXPIRATION_TIME }}
  REFRESH_EXPIRATION_TIME: ${{ secrets.REFRESH_EXPIRATION_TIME }}

  AUTH_DB_USER: ${{ secrets.AUTH_DB_USER }}
  AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
  AUTH_DB_URL: ${{ secrets.AUTH_DB_URL }}

  POINTS_DB_USER: ${{ secrets.POINTS_DB_USER }}
  POINTS_DB_PASSWORD: ${{ secrets.POINTS_DB_PASSWORD }}
  POINTS_DB_URL: ${{ secrets.POINTS_DB_URL }}

  KAFKA_URL: ${{ secrets.KAFKA_URL }}
  AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}
  POINTS_SERVICE_URL: ${{ secrets.POINTS_SERVICE_URL }}
  ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

  COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
  COOKIE_SAME_SITE: ${{ secrets.COOKIE_SAME_SITE }}

name: backend deploy
on:
  push:
    branches: [master, devops]

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Java environment
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-microservices-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 30

  build-docker-images:
    runs-on: ubuntu-latest
    needs: build-jar

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-microservices-jars

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build common-base
        run: docker build -f Dockerfile.common -t ${{ secrets.DOCKER_USERNAME }}/common-base:${{ env.IMAGE_TAG }} .

      - name: Push common-base
        run: docker push ${{ secrets.DOCKER_USERNAME }}/common-base:${{ env.IMAGE_TAG }}

      - name: Build microservices
        run: docker compose -f docker-compose.prod.yml build --build-arg BASE_IMAGE=${BASE_IMAGE}

      - name: Push microservices
        run: docker compose -f docker-compose.prod.yml push